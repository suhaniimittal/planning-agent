[project]
name = "generic-webhook"
version = "0.1.0"
description = "Generic webhook handler with JWT validation"
authors = [{ name = "Calfus", email = "cloudops@calfus.com" }]
requires-python = ">=3.12.10,<3.14"
readme = "README.md"
dependencies = [

]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["webhook_handler"]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.3.0",
    "pytest-mock==3.15.1",
    "ruff==0.12.12",
    "black==25.12.0",
]

[[tool.uv.index]]
name = "default"
url = "https://pypi.org/simple/"
default = true

[[tool.uv.index]]
name = "codeartifact"
url = "https://aetherion-285774563994.d.codeartifact.us-east-1.amazonaws.com/pypi/aetherion/simple/"
explicit = true

[tool.uv.sources]
ursa = { index = "codeartifact" }

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"