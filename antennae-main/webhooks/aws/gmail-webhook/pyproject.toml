[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["webhook_handler", "config"]

[project]
name = "gmail-webhook"
version = "0.1.0"
description = "Gmail webhook handler"
authors = [{ name = "Calfus", email = "cloudops@calfus.com" }]
requires-python = ">=3.12.10,<3.14"
readme = "README.md"

dependencies = [
    "PyJWT[crypto]==2.8.0",
    "cryptography==46.0.5",
    "boto3==1.40.20",
    "requests==2.32.3",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.3.0",
    "pytest-mock==3.15.1",
    "ruff==0.12.12",
    "black==25.12.0",
]

# Tests load webhook_handler via importlib; --cov=webhook_handler misses it. Omit tests from denominator.
[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
