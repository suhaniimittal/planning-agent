name: Build AWS Consumer Images

on:
  push:
    branches:
      - main
      # - "release/*-rc"   # not in use — re-enable when RC flow is reintroduced
      # - "hotfix/**"      # not in use — re-enable when hotfix flow is reintroduced
    paths:
      - "consumers/aws/**"
  # schedule:
  #   # Nightly QA sbox deploy — disabled; QA team controls deployment via qa-deploy.yml
  #   - cron: "0 3 * * *"

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_PREFIX: antennae
  PYTHON_VERSION: "3.12"

concurrency:
  group: build-consumers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- Nightly QA sbox: update helix with latest image tags for all antennae consumers (image must exist in ECR) ---
  nightly-qa-deploy:
    name: Nightly QA Sbox Deploy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Checkout helix to read target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: CalfusAgentFoundry/helix
          token: "${{ secrets.HELIX_REPO_PAT }}"
          path: helix-repo
          ref: main

      - name: Read qa current_rc_version and decide
        id: target
        run: |
          TENANTS_FILE="helix-repo/sbox/config/tenants.json"
          if [[ ! -f "$TENANTS_FILE" ]]; then
            echo "::error::Missing $TENANTS_FILE"
            exit 1
          fi
          RC_VERSION=$(jq -r '.[] | select(.tenant=="qa") | .current_rc_version // empty' "$TENANTS_FILE")
          if [[ -z "$RC_VERSION" ]]; then
            echo "run_deploy=false" >> $GITHUB_OUTPUT
            echo "Skipping nightly deploy: no current_rc_version set for qa tenant." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "rc_version=$RC_VERSION" >> $GITHUB_OUTPUT
          echo "run_deploy=true" >> $GITHUB_OUTPUT

      - name: Checkout antennae at target branch
        if: steps.target.outputs.run_deploy == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.target.outputs.rc_version }}
          fetch-depth: 1
          path: antennae-repo

      - name: Discover consumers and set image tag
        if: steps.target.outputs.run_deploy == 'true'
        id: discover
        working-directory: antennae-repo
        run: |
          BASE_PATH="consumers/aws"
          all_consumers=()
          for d in "$BASE_PATH"/*/; do
            [ -f "${d}Dockerfile" ] && all_consumers+=("$(basename "$d")")
          done
          # JSON list for later
          json="[$(printf '"%s",' "${all_consumers[@]}" | sed 's/,$//')]"
          echo "consumers=$json" >> $GITHUB_OUTPUT
          SHORT_SHA=$(git rev-parse HEAD | cut -c1-7)
          echo "short_sha=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Found ${#all_consumers[@]} consumers: ${all_consumers[*]}"

      - name: Configure AWS credentials (for ECR check)
        if: steps.target.outputs.run_deploy == 'true'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-action-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine consumers with image in ECR
        if: steps.target.outputs.run_deploy == 'true'
        id: ecr-check
        env:
          IMAGE_TAG: ${{ steps.discover.outputs.short_sha }}
          PREFIX: ${{ env.ECR_REPOSITORY_PREFIX }}
          REGION: ${{ env.AWS_REGION }}
        run: |
          consumers_json='${{ steps.discover.outputs.consumers }}'
          # Parse JSON list (e.g. ["c1","c2"]) and enforce all-or-nothing.
          to_update=()
          missing=()
          for name in $(echo "$consumers_json" | jq -r '.[]'); do
            repo="${PREFIX}/${name}"
            err_file="$(mktemp)"
            if aws ecr describe-images --repository-name "$repo" --image-ids imageTag="${IMAGE_TAG}" --region "$REGION" --output text >/dev/null 2>"$err_file"; then
              to_update+=("$name")
            else
              err_msg="$(<"$err_file")"
              if [[ "$err_msg" == *"ImageNotFoundException"* || "$err_msg" == *"RepositoryNotFoundException"* ]]; then
                missing+=("$name")
                echo "::error::Image ${repo}:${IMAGE_TAG} not found in ECR."
              else
                echo "::error::ECR check failed for ${repo}:${IMAGE_TAG}. AWS/API error: ${err_msg}"
                echo "updated_consumers=[]" >> $GITHUB_OUTPUT
                echo "image_found=false" >> $GITHUB_OUTPUT
                rm -f "$err_file"
                exit 1
              fi
            fi
            rm -f "$err_file"
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing images for ${IMAGE_TAG}. Refusing partial rollout. Missing consumers: ${missing[*]}"
            echo "updated_consumers=[]" >> $GITHUB_OUTPUT
            echo "image_found=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          if [ ${#to_update[@]} -eq 0 ]; then
            echo "updated_consumers=[]" >> $GITHUB_OUTPUT
            echo "image_found=false" >> $GITHUB_OUTPUT
            echo "::error::No consumer images found for ${IMAGE_TAG} in ECR."
            exit 1
          else
            echo "updated_consumers=[$(printf '"%s",' "${to_update[@]}" | sed 's/,$//')]" >> $GITHUB_OUTPUT
            echo "image_found=true" >> $GITHUB_OUTPUT
          fi

      # Helix stays on main — no branch checkout needed (gitops_target is always main)

      - name: Update qa values with image tags for consumers
        if: steps.target.outputs.run_deploy == 'true' && steps.ecr-check.outputs.image_found == 'true'
        env:
          IMAGE_TAG: ${{ steps.discover.outputs.short_sha }}
          UPDATED_CONSUMERS: ${{ steps.ecr-check.outputs.updated_consumers }}
        run: |
          cd helix-repo
          VALUES_FILE="values/tenants/sbox/qa.yaml"
          if ! command -v yq &> /dev/null; then
            install_dir="$HOME/.local/bin"
            mkdir -p "$install_dir"
            wget -qO "$install_dir/yq" https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            chmod +x "$install_dir/yq"
            echo "$install_dir" >> $GITHUB_PATH
            export PATH="$install_dir:$PATH"
          fi
          for name in $(echo "$UPDATED_CONSUMERS" | jq -r '.[]'); do
            yq e ".images[\"${name}\"].tag = \"${IMAGE_TAG}\"" -i "$VALUES_FILE"
            echo "Updated $name -> $IMAGE_TAG"
          done

      - name: Commit and push to helix
        if: steps.target.outputs.run_deploy == 'true' && steps.ecr-check.outputs.image_found == 'true'
        run: |
          cd helix-repo
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then exit 0; fi
          git add values/tenants/sbox/qa.yaml
          git commit -m "chore(nightly): update antennae consumers to ${{ steps.discover.outputs.short_sha }} [qa-sbox]"
          git push origin main

      - name: Summary (nightly)
        if: always()
        run: |
          echo "## Nightly QA Sbox Summary" >> $GITHUB_STEP_SUMMARY
          echo "QA RC version: ${{ steps.target.outputs.rc_version }}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.target.outputs.run_deploy }}" != "true" ]]; then
            echo "Deploy: Skipped (target is main)" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ steps.ecr-check.outcome }}" == "failure" ]]; then
            echo "**Deploy failed:** ECR verification failed (missing image(s) or AWS/API error). Helix retained." >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ steps.ecr-check.outputs.image_found }}" != "true" ]]; then
            echo "**Deploy failed:** No antennae consumer images found for \`${{ steps.discover.outputs.short_sha }}\` in ECR. Helix retained." >> $GITHUB_STEP_SUMMARY
          else
            echo "Image Tag: ${{ steps.discover.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY
            echo "Consumers updated: ${{ steps.ecr-check.outputs.updated_consumers }}" >> $GITHUB_STEP_SUMMARY
            echo "Helix Branch: main" >> $GITHUB_STEP_SUMMARY
          fi

  discover:
    if: github.event_name == 'push'
    runs-on: self-hosted
    outputs:
      consumers: ${{ steps.set-matrix.outputs.consumers }}
      values_files: ${{ steps.set-target.outputs.values_files }}
      helix_branch: ${{ steps.set-target.outputs.helix_branch }}
      environment: ${{ steps.set-target.outputs.environment }}
      should_update: ${{ steps.set-target.outputs.should_update }}
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0

      - name: Ensure consumer folder exists
        id: base-path
        shell: bash
        run: |
          BASE_PATH="consumers/aws"
          if [ ! -d "$BASE_PATH" ]; then
            echo "Expected $BASE_PATH (or consumers/aws) not found." >&2
            exit 1
          fi
          echo "BASE_PATH=$BASE_PATH" >> $GITHUB_OUTPUT

      - name: Determine consumers list
        id: set-matrix
        shell: bash
        env:
          BASE_PATH: ${{ steps.base-path.outputs.BASE_PATH }}
          GITHUB_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          base="$BASE_PATH"

          # 1. Discover all valid consumers (Candidate List)
          echo "Discovering consumers in $base..."
          all_consumers=()
          mapfile -t dirs < <(find "$base" -maxdepth 1 -mindepth 1 -type d -print | sort)
          for d in "${dirs[@]}"; do
            if [ -f "$d/Dockerfile" ]; then
              all_consumers+=("$(basename "$d")")
            fi
          done

          echo "Found ${#all_consumers[@]} valid consumers: ${all_consumers[*]}"
          targets=()

          # 2. Apply Filters based on Branch

          # Case A: Push to RC/Hotfix Branch -> Build ALL (Strict Repo SHA)
          if [[ "$GITHUB_REF" =~ refs/heads/release/.*-rc ]] || [[ "$GITHUB_REF" =~ refs/heads/hotfix/.* ]]; then
            echo "RC/Hotfix branch detected ($REF_NAME) - forcing build of ALL consumers with repo HEAD SHA"
            targets=("${all_consumers[@]}")

          # Case B: Push to Main -> Build Changed Only
          else
            echo "Push event to main - filtering changed consumers only..."

            # Fetch history to ensure we can diff against previous commit
            changed_files=$(git diff --name-only HEAD~1 HEAD || echo "")

            if [ -z "$changed_files" ]; then
              echo "No files changed in this commit."
            else
              for consumer in "${all_consumers[@]}"; do
                # Check if any changed file starts with base/consumer/
                if echo "$changed_files" | grep -q "^$base/$consumer/"; then
                  echo "  - Change detected in: $consumer"
                  targets+=("$consumer")
                fi
              done
            fi
          fi

          # 3. Output Matrix (empty when Case B has no consumer changes)
          if [ ${#targets[@]} -eq 0 ]; then
             echo "No consumers selected for build."
             echo "consumers=[]" >> $GITHUB_OUTPUT
             exit 0
          fi

          # Deduplicate targets (just in case)
          sorted_unique_targets=($(echo "${targets[@]}" | tr ' ' '\n' | sort -u | tr '\n' ' '))

          # Format as JSON for matrix
          json="[$(printf '"%s",' "${sorted_unique_targets[@]}" | sed 's/,$//')]"

          echo "Final Target List: ${sorted_unique_targets[*]}"
          echo "consumers=$json" >> $GITHUB_OUTPUT

      - name: Set deployment target
        id: set-target
        run: |
          BRANCH="${{ github.ref_name }}"

          # Release branches: build/push only; helix qa-sbox is updated by nightly.
          if [[ "$BRANCH" =~ ^release/.*-rc$ ]]; then
            echo "should_update=false" >> $GITHUB_OUTPUT
            echo "values_files=values/tenants/sbox/qa.yaml" >> $GITHUB_OUTPUT
            echo "helix_branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "environment=sbox" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" =~ ^hotfix/ ]]; then
            echo "should_update=true" >> $GITHUB_OUTPUT
            echo "values_files=values/tenants/sbox/qa.yaml" >> $GITHUB_OUTPUT
            echo "helix_branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "environment=sbox" >> $GITHUB_OUTPUT
          else
            echo "should_update=true" >> $GITHUB_OUTPUT
            echo "values_files=values/tenants/dev/calfus.yaml" >> $GITHUB_OUTPUT
            echo "helix_branch=main" >> $GITHUB_OUTPUT
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

  build:
    needs: discover
    if: github.event_name == 'push' && needs.discover.outputs.consumers != '[]' && needs.discover.outputs.consumers != ''
    runs-on: self-hosted
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        consumer: ${{ fromJSON(needs.discover.outputs.consumers) }}
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@4574d27a4764455b42196d70a065bc6853246a25

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-action-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve CodeArtifact endpoint and token
        id: ca
        shell: bash
        run: |
          set -euo pipefail
          endpoint=$(aws codeartifact get-repository-endpoint \
            --domain "${{ secrets.CODEARTIFACT_DOMAIN }}" \
            --domain-owner "${{ secrets.AWS_ACCOUNT_ID }}" \
            --repository "${{ secrets.CODEARTIFACT_REPOSITORY }}" \
            --format pypi \
            --query repositoryEndpoint --output text)
          echo "repo_url=${endpoint}simple/" >> "$GITHUB_OUTPUT"
          token=$(aws codeartifact get-authorization-token \
            --domain "${{ secrets.CODEARTIFACT_DOMAIN }}" \
            --domain-owner "${{ secrets.AWS_ACCOUNT_ID }}" \
            --query authorizationToken --output text)
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076

      - name: Determine base path
        id: base-path
        shell: bash
        run: |
          BASE_PATH="consumers/aws"
          echo "BASE_PATH=$BASE_PATH" >> $GITHUB_OUTPUT

      - name: Ensure ECR repository exists
        shell: bash
        run: |
          set -euo pipefail
          repo="${ECR_REPOSITORY_PREFIX}/${{ matrix.consumer }}"
          aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$repo" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 >/dev/null
          echo "ECR repository ensured: $repo"

      - name: Generate image tag
        id: image-tag
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          # Use folder-level SHA: last commit that touched this consumer's folder.
          # This matches the SHA used by nightly-release.sh (Step 2) when retagging to CalVer.
          FOLDER_SHA=$(git log -1 --format=%H -- "consumers/aws/${{ matrix.consumer }}" | cut -c1-7)
          if [[ -z "$FOLDER_SHA" ]]; then
            echo "::warning::No folder-level commit found for consumers/aws/${{ matrix.consumer }}, falling back to repo HEAD"
            FOLDER_SHA="${GITHUB_SHA::7}"
          fi
          IMAGE_TAG="sha-${FOLDER_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${FOLDER_SHA}" >> $GITHUB_OUTPUT
          echo "Using folder-level image tag: ${IMAGE_TAG} (consumers/aws/${{ matrix.consumer }})"

      - name: Build and push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ${{ steps.base-path.outputs.BASE_PATH }}/${{ matrix.consumer }}
          file: ${{ steps.base-path.outputs.BASE_PATH }}/${{ matrix.consumer }}/Dockerfile
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_PREFIX }}/${{ matrix.consumer }}:${{ steps.image-tag.outputs.image_tag }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_PREFIX }}/${{ matrix.consumer }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            codeartifact_token=${{ steps.ca.outputs.token }}

      - name: Checkout helix repository
        if: needs.discover.outputs.should_update == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: CalfusAgentFoundry/helix
          token: "${{ secrets.HELIX_REPO_PAT }}"
          path: helix-repo

      - name: Prepare helix branch
        if: needs.discover.outputs.should_update == 'true'
        run: |
          cd helix-repo
          HELIX_BRANCH="${{ needs.discover.outputs.helix_branch }}"

          # Fetch and checkout the branch (must exist)
          git fetch origin
          git checkout "$HELIX_BRANCH"

      - name: Update values file with new image tag
        if: needs.discover.outputs.should_update == 'true'
        env:
          ECR_REPOSITORY: ${{ matrix.consumer }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
          VALUES_FILES: ${{ needs.discover.outputs.values_files }}
        run: |
          cd helix-repo

          # Ensure yq is available (same approach as andromeda deploy_to_ecr)
          if ! command -v yq &> /dev/null; then
            install_dir="$HOME/.local/bin"
            mkdir -p "$install_dir"
            wget -qO "$install_dir/yq" https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            chmod +x "$install_dir/yq"
            echo "$install_dir" >> $GITHUB_PATH
            export PATH="$install_dir:$PATH"
          fi

          # Update images.<consumer>.tag in each values file (main -> dev/calfus.yaml; RC/hotfix -> sbox/qa.yaml)
          for VALUES_FILE in $VALUES_FILES; do
            echo "Updating $VALUES_FILE..."
            yq e ".images[\"${ECR_REPOSITORY}\"].tag = \"${IMAGE_TAG}\"" -i "$VALUES_FILE"
            echo "Updated $VALUES_FILE:"
            yq e ".images[\"${ECR_REPOSITORY}\"]" "$VALUES_FILE"
          done

      - name: Commit and push changes to helix repository
        if: needs.discover.outputs.should_update == 'true'
        env:
          ECR_REPOSITORY: ${{ matrix.consumer }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
          VALUES_FILES: ${{ needs.discover.outputs.values_files }}
          SOURCE_BRANCH: ${{ needs.discover.outputs.helix_branch }}
          ENVIRONMENT: ${{ needs.discover.outputs.environment }}
        run: |
          cd helix-repo

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Add all modified values files
          for VALUES_FILE in $VALUES_FILES; do
            git add "$VALUES_FILE"
          done

          git commit -m "chore($SOURCE_BRANCH): update ${ECR_REPOSITORY} to ${IMAGE_TAG} [$ENVIRONMENT]"
          git push origin "${{ needs.discover.outputs.helix_branch }}"
