name: Deploy Lambda Webhooks

on:
  push:
    branches:
      - main
  # schedule:
  #   # Nightly QA sbox deploy — disabled; QA team controls deployment via qa-deploy.yml
  #   - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      webhook:
        description: "Webhook to deploy (when 'all' on RC/Tag, deploys all webhooks)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - generic-webhook
          - slack-webhook
          - gmail-webhook
          - voice-webhook
          - jira-webhook
          - graph-mail-reply-webhook
          - unified-webhook
      environment:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - sbox
          - sre
          - prod
      ref:
        description: "Branch or tag to deploy FROM (e.g., release/v1.0.1-rc, v1.0.1, main). IMPORTANT: When GitHub asks for 'Use workflow from', select 'main' (workflow file location). This 'ref' input is for the CODE to deploy."
        required: false
        type: string

permissions:
  id-token: write
  contents: write

env:
  PYTHON_VERSION: "3.12.10"
  ARTIFACT_BUCKET: "aetherion-deployment-artifacts" # Bucket for Lambda zips (in non-prod account)
  NONPROD_ACCOUNT_ID: "285774563994" # Non-prod account (dev, sbox)
  PROD_ACCOUNT_ID: "079357062635" # Prod account

jobs:
  detect-changes:
    name: Detect Changed Webhooks
    runs-on: self-hosted
    outputs:
      generic-webhook: ${{ steps.filter.outputs.generic-webhook }}
      slack-webhook: ${{ steps.filter.outputs.slack-webhook }}
      gmail-webhook: ${{ steps.filter.outputs.gmail-webhook }}
      voice-webhook: ${{ steps.filter.outputs.voice-webhook }}
      jira-webhook: ${{ steps.filter.outputs.jira-webhook }}
      graph-mail-reply-webhook: ${{ steps.filter.outputs.graph-mail-reply-webhook }}
      unified-webhook: ${{ steps.filter.outputs.unified-webhook }}
      deploy-all: ${{ steps.check-deploy-all.outputs.deploy-all }}
      environment: ${{ steps.set-env.outputs.environment }}
      aws-region: ${{ steps.set-env.outputs.aws_region }}
      account-id: ${{ steps.set-env.outputs.account_id }}
      is_tag: ${{ steps.set-version.outputs.is_tag }}
      is_rc_branch: ${{ steps.set-version.outputs.is_rc_branch }}
      version: ${{ steps.set-version.outputs.version }}
      ref: ${{ steps.set-ref.outputs.ref }}
      skip_nightly: ${{ steps.set-skip-nightly.outputs.skip_nightly }}
    steps:
      # --- Nightly: resolve qa gitops_target from helix; if main skip, else deploy all webhooks to sbox from that ref ---
      - name: Resolve nightly target (schedule only)
        if: github.event_name == 'schedule'
        id: nightly
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: CalfusAgentFoundry/helix
          token: "${{ secrets.HELIX_REPO_PAT }}"
          path: helix-repo
          ref: main

      - name: Read qa gitops_target and set nightly ref
        if: github.event_name == 'schedule'
        id: nightly-ref
        run: |
          TENANTS_FILE="helix-repo/sbox/config/tenants.json"
          if [[ ! -f "$TENANTS_FILE" ]]; then
            echo "::error::Missing $TENANTS_FILE"
            exit 1
          fi
          GITOPS_TARGET=$(jq -r '.[] | select(.tenant=="qa") | .gitops_target' "$TENANTS_FILE")
          if [[ -z "$GITOPS_TARGET" || "$GITOPS_TARGET" == "null" ]]; then
            echo "::error::Could not find qa tenant or gitops_target in tenants.json"
            exit 1
          fi
          echo "ref=$GITOPS_TARGET" >> $GITHUB_OUTPUT
          if [[ "$GITOPS_TARGET" == "main" ]]; then
            echo "skip_nightly=true" >> $GITHUB_OUTPUT
            echo "Skipping nightly: qa gitops_target is main." >> $GITHUB_STEP_SUMMARY
          else
            echo "skip_nightly=false" >> $GITHUB_OUTPUT
            echo "Nightly sbox deploy from ref: $GITOPS_TARGET" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Set skip_nightly for job output
        id: set-skip-nightly
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "skip_nightly=${{ steps.nightly-ref.outputs.skip_nightly }}" >> $GITHUB_OUTPUT
          else
            echo "skip_nightly=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: github.event_name != 'schedule'
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0 # Fetch all history for accurate change detection

      - name: Check for path changes
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            generic-webhook:
              - 'webhooks/aws/generic-webhook/**'
            slack-webhook:
              - 'webhooks/aws/slack-webhook/**'
            gmail-webhook:
              - 'webhooks/aws/gmail-webhook/**'
            voice-webhook:
              - 'webhooks/aws/voice-webhook/**'
            jira-webhook:
              - 'webhooks/aws/jira-webhook/**'
            graph-mail-reply-webhook:
              - 'webhooks/aws/graph-mail-reply-webhook/**'
            unified-webhook:
              - 'webhooks/aws/unified-webhook/**'
            # Add more webhooks here:
            # teams-webhook:
            #   - 'webhooks/aws/teams-webhook/**'

      - name: Check if manual deploy all
        id: check-deploy-all
        env:
          EVENT_NAME: ${{ github.event_name }}
          WEBHOOK_INPUT: ${{ github.event.inputs.webhook }}
          GITHUB_REF: ${{ github.ref }}
          SKIP_NIGHTLY: ${{ steps.set-skip-nightly.outputs.skip_nightly }}
        run: |
          # Nightly schedule: deploy all webhooks to sbox from qa gitops_target (unless target is main)
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            if [[ "$SKIP_NIGHTLY" == "true" ]]; then
              echo "deploy-all=false" >> $GITHUB_OUTPUT
            else
              echo "deploy-all=true" >> $GITHUB_OUTPUT
              echo "Nightly: deploy ALL webhooks to sbox from qa gitops_target"
            fi
            exit 0
          fi
          # Force deploy all webhooks on RC/Hotfix branches (strict repo SHA model)
          if [[ "$GITHUB_REF" =~ refs/heads/release/.*-rc ]] || [[ "$GITHUB_REF" =~ refs/heads/hotfix/.* ]]; then
            echo "deploy-all=true" >> $GITHUB_OUTPUT
            echo "ℹ️  RC/Hotfix branch detected - will deploy ALL webhooks with repo HEAD SHA"
          # Deploy all if manual trigger with "all" selected
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$WEBHOOK_INPUT" == "all" ]]; then
            echo "deploy-all=true" >> $GITHUB_OUTPUT
          # For push events to main, deploy only changed webhooks (use path filter)
          elif [[ "$EVENT_NAME" == "push" ]]; then
            echo "deploy-all=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Push to main detected - will deploy only changed webhooks"
          else
            echo "deploy-all=false" >> $GITHUB_OUTPUT
          fi

      - name: Set ref to checkout
        id: set-ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          # Nightly: use qa gitops_target from helix (already resolved in nightly-ref step)
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ steps.nightly-ref.outputs.skip_nightly }}" == "true" ]]; then
              echo "ref=refs/heads/main" >> $GITHUB_OUTPUT
            else
              echo "ref=${{ steps.nightly-ref.outputs.ref }}" >> $GITHUB_OUTPUT
              echo "✅ Nightly ref: ${{ steps.nightly-ref.outputs.ref }}"
            fi
            exit 0
          fi
          # IMPORTANT: Two different "ref" concepts:
          # 1. GitHub branch selector (github.ref) - which workflow file to use (usually "main")
          # 2. ref input parameter - which code to deploy from (e.g., "release/v1.0.1-rc", "v1.0.1")
          #
          # Priority: ref input > github.ref (branch selector)

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_REF" ]]; then
            # Manual trigger with ref input provided - use it
            echo "ref=$INPUT_REF" >> $GITHUB_OUTPUT
            echo "✅ Using ref input: $INPUT_REF"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # Manual trigger without ref input - use branch selector
            if [[ "$GITHUB_REF" =~ ^refs/tags/ ]]; then
              echo "ref=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
            else
              echo "ref=$GITHUB_REF" >> $GITHUB_OUTPUT
            fi
            echo "ℹ️  Using branch selector: $GITHUB_REF (consider using 'ref' input for clarity)"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/ ]]; then
            # Tag push event
            echo "ref=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          else
            # Branch push event (e.g., main)
            echo "ref=$GITHUB_REF" >> $GITHUB_OUTPUT
          fi

      - name: Determine if ref is a tag or RC branch
        id: set-version
        run: |
          REF="${{ steps.set-ref.outputs.ref }}"
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version=$REF" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "is_rc_branch=false" >> $GITHUB_OUTPUT
          elif [[ "$REF" =~ ^release/.*-rc$ ]]; then
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "is_rc_branch=true" >> $GITHUB_OUTPUT
          elif [[ "$REF" =~ ^hotfix/.*$ ]]; then
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "is_rc_branch=true" >> $GITHUB_OUTPUT # Treat hotfix like RC for deployment logic
            echo "⚠️  HOTFIX DETECTED: Ensure commit $REF exists in main (cherry-pick rule)!"
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "is_rc_branch=false" >> $GITHUB_OUTPUT
          fi

      - name: Set environment and region
        id: set-env
        env:
          EVENT_NAME: ${{ github.event_name }}
          ENVIRONMENT_INPUT: ${{ github.event.inputs.environment }}
          GITHUB_REF: ${{ github.ref }}
          SKIP_NIGHTLY: ${{ steps.set-skip-nightly.outputs.skip_nightly }}
        run: |
          # Nightly schedule: deploy to sbox (unless skip_nightly)
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            if [[ "$SKIP_NIGHTLY" == "true" ]]; then
              ENV="dev"
            else
              ENV="sbox"
            fi
            echo "environment=$ENV" >> $GITHUB_OUTPUT
            if [[ "$ENV" == "sbox" ]]; then
              echo "aws_region=us-west-1" >> $GITHUB_OUTPUT
              echo "account_id=${{ env.NONPROD_ACCOUNT_ID }}" >> $GITHUB_OUTPUT
            else
              echo "aws_region=us-east-1" >> $GITHUB_OUTPUT
              echo "account_id=${{ env.NONPROD_ACCOUNT_ID }}" >> $GITHUB_OUTPUT
            fi
            echo "s3_account_id=${{ env.NONPROD_ACCOUNT_ID }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # Manual trigger - use input environment
            ENV="$ENVIRONMENT_INPUT"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # Auto-deploy from main branch → dev
            ENV="dev"
          elif [[ "$GITHUB_REF" =~ ^refs/heads/release/.*-rc$ ]] || [[ "$GITHUB_REF" =~ ^refs/heads/hotfix/.*$ ]]; then
            # RC/Hotfix branch - strict rule: must be manual trigger
            if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "❌ RC/Hotfix deployments must be manually triggered via workflow_dispatch"
              exit 1
            fi
            
            if [[ -z "$ENVIRONMENT_INPUT" ]]; then
               echo "❌ RC/Hotfix deployments require explicit 'environment' input"
               exit 1
            fi

            ENV="$ENVIRONMENT_INPUT"
          else
            # Default to dev for any other branch (feature branches, etc.)
            ENV="dev"
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT

          # Set region and account based on environment
          case "$ENV" in
            dev)
              echo "aws_region=us-east-1" >> $GITHUB_OUTPUT
              echo "account_id=${{ env.NONPROD_ACCOUNT_ID }}" >> $GITHUB_OUTPUT
              ;;
            sbox)
              echo "aws_region=us-west-1" >> $GITHUB_OUTPUT
              echo "account_id=${{ env.NONPROD_ACCOUNT_ID }}" >> $GITHUB_OUTPUT
              ;;
            sre)
              echo "aws_region=us-east-2" >> $GITHUB_OUTPUT
              echo "account_id=${{ env.NONPROD_ACCOUNT_ID }}" >> $GITHUB_OUTPUT
              ;;
            prod)
              echo "aws_region=us-east-2" >> $GITHUB_OUTPUT
              echo "account_id=${{ env.PROD_ACCOUNT_ID }}" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "aws_region=us-east-1" >> $GITHUB_OUTPUT
              echo "account_id=${{ env.NONPROD_ACCOUNT_ID }}" >> $GITHUB_OUTPUT
              ;;
          esac

          # S3 bucket is always in non-prod account
          echo "s3_account_id=${{ env.NONPROD_ACCOUNT_ID }}" >> $GITHUB_OUTPUT

  deploy-webhook:
    name: Deploy ${{ matrix.webhook }} to ${{ needs.detect-changes.outputs.environment }}
    runs-on: self-hosted
    needs: detect-changes
    if: needs.detect-changes.outputs.skip_nightly != 'true'
    strategy:
      matrix:
        webhook:
          - generic-webhook
          - slack-webhook
          - gmail-webhook
          - voice-webhook
          - jira-webhook
          - graph-mail-reply-webhook
          - unified-webhook
      fail-fast: false # Continue deploying other webhooks even if one fails

    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    steps:
      - name: Check if webhook should deploy
        id: should-deploy
        env:
          DEPLOY_ALL: ${{ needs.detect-changes.outputs.deploy-all }}
          IS_TAG_DEPLOY: ${{ needs.detect-changes.outputs.is_tag }}
          GENERIC_WEBHOOK: ${{ needs.detect-changes.outputs.generic-webhook }}
          SLACK_WEBHOOK: ${{ needs.detect-changes.outputs.slack-webhook }}
          GMAIL_WEBHOOK: ${{ needs.detect-changes.outputs.gmail-webhook }}
          VOICE_WEBHOOK: ${{ needs.detect-changes.outputs.voice-webhook }}
          JIRA_WEBHOOK: ${{ needs.detect-changes.outputs.jira-webhook }}
          GRAPH_MAIL_REPLY_WEBHOOK: ${{ needs.detect-changes.outputs.graph-mail-reply-webhook }}
          UNIFIED_WEBHOOK: ${{ needs.detect-changes.outputs.unified-webhook }}
          MATRIX_WEBHOOK: ${{ matrix.webhook }}
          EVENT_NAME: ${{ github.event_name }}
          WEBHOOK_INPUT: ${{ github.event.inputs.webhook }}
        run: |
          DEPLOY="false"

          # Deploy if manual "all" selected
          if [[ "$DEPLOY_ALL" == "true" ]]; then
            DEPLOY="true"
          # Deploy ALL webhooks if deploying from tag (production release) OR RC/Hotfix branch
          elif [[ "${{ needs.detect-changes.outputs.is_tag }}" == "true" ]] || [[ "${{ needs.detect-changes.outputs.is_rc_branch }}" == "true" ]]; then
            DEPLOY="true"
            echo "ℹ️  Release/Tag deployment: Deploying ALL webhooks (reuse if unchanged)"
          # Deploy if this specific webhook changed (push events)
          elif [[ "$MATRIX_WEBHOOK" == "generic-webhook" && "$GENERIC_WEBHOOK" == "true" ]]; then
            DEPLOY="true"
          elif [[ "$MATRIX_WEBHOOK" == "slack-webhook" && "$SLACK_WEBHOOK" == "true" ]]; then
            DEPLOY="true"
          elif [[ "$MATRIX_WEBHOOK" == "gmail-webhook" && "$GMAIL_WEBHOOK" == "true" ]]; then
            DEPLOY="true"
          elif [[ "$MATRIX_WEBHOOK" == "voice-webhook" && "$VOICE_WEBHOOK" == "true" ]]; then
            DEPLOY="true"
          elif [[ "$MATRIX_WEBHOOK" == "jira-webhook" && "$JIRA_WEBHOOK" == "true" ]]; then
            DEPLOY="true"
          elif [[ "$MATRIX_WEBHOOK" == "graph-mail-reply-webhook" && "$GRAPH_MAIL_REPLY_WEBHOOK" == "true" ]]; then
            DEPLOY="true"
          elif [[ "$MATRIX_WEBHOOK" == "unified-webhook" && "$UNIFIED_WEBHOOK" == "true" ]]; then
            DEPLOY="true"
          # Deploy if manual trigger for this specific webhook
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$WEBHOOK_INPUT" == "$MATRIX_WEBHOOK" ]]; then
            DEPLOY="true"
          fi

          echo "deploy=$DEPLOY" >> $GITHUB_OUTPUT
          if [[ "$DEPLOY" == "true" ]]; then
            echo "✅ Will deploy $MATRIX_WEBHOOK"
          else
            echo "⏭️  Skipping $MATRIX_WEBHOOK (no changes detected)"
          fi

      - name: Checkout code
        if: steps.should-deploy.outputs.deploy == 'true'
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ needs.detect-changes.outputs.ref }}
          fetch-depth: 0 # Need full history to resolve tag to commit

      - name: Get commit SHA (Folder-Level)
        if: steps.should-deploy.outputs.deploy == 'true'
        id: get-commit-sha
        run: |
          # USE FOLDER-LEVEL SHA: Derive the artifact version from the last commit

          WEBHOOK_PATH="webhooks/aws/${{ matrix.webhook }}"
          FOLDER_SHA=$(git log -1 --format=%H -- "$WEBHOOK_PATH" 2>/dev/null || echo "")

          if [[ -n "$FOLDER_SHA" ]]; then
            COMMIT_SHA="$FOLDER_SHA"
            echo "Using folder-level SHA for ${{ matrix.webhook }} (from: $WEBHOOK_PATH)"
          else
            # Fallback to repo HEAD if no folder-specific commit found (e.g., brand new webhook)
            COMMIT_SHA=$(git rev-parse HEAD 2>/dev/null || echo "")
            [[ -z "$COMMIT_SHA" ]] && COMMIT_SHA="${{ github.sha }}"
            echo "No folder-level commit found for $WEBHOOK_PATH, falling back to repo HEAD"
          fi

          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)

          echo "commit_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "sha_version=sha-$SHORT_SHA" >> $GITHUB_OUTPUT

          echo "✅ Artifact Version: sha-$SHORT_SHA (folder-level SHA for ${{ matrix.webhook }})"

      - name: Configure AWS credentials for S3 (non-prod account)
        if: steps.should-deploy.outputs.deploy == 'true'
        id: aws-s3-creds
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          aws-region: us-east-1 # S3 bucket region (non-prod account)
          role-to-assume: arn:aws:iam::${{ env.NONPROD_ACCOUNT_ID }}:role/github-action-deploy-role
        env:
          AWS_REGION: us-east-1

      - name: Check if S3 artifact exists (non-prod account)
        if: steps.should-deploy.outputs.deploy == 'true' && steps.get-commit-sha.outputs.sha_version != ''
        id: check-s3-artifact
        env:
          AWS_REGION: us-east-1 # S3 is in non-prod account
        run: |
          SHA_VERSION="${{ steps.get-commit-sha.outputs.sha_version }}"
          S3_KEY="lambdas/${{ matrix.webhook }}/${SHA_VERSION}.zip"
          S3_URI="s3://${{ env.ARTIFACT_BUCKET }}/${S3_KEY}"

          echo "🔍 Checking S3 artifact in non-prod account..."
          echo "   Bucket: ${{ env.ARTIFACT_BUCKET }}"
          echo "   Key: $S3_KEY"

          if aws s3 ls "$S3_URI" > /dev/null 2>&1; then
            echo "✅ Found existing S3 artifact: $S3_URI"
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "source_s3_key=$S3_KEY" >> $GITHUB_OUTPUT
          else
            echo "⚠️  S3 artifact not found: $S3_URI"
            echo "exists=false" >> $GITHUB_OUTPUT
            if [[ "${{ needs.detect-changes.outputs.is_tag }}" == "true" ]]; then
              echo "Will build new package from tag"
            else
              echo "Will build new package from branch"
            fi
          fi

      - name: Set up Python
        if: steps.should-deploy.outputs.deploy == 'true'
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check if webhook exists
        if: steps.should-deploy.outputs.deploy == 'true'
        id: check-exists
        run: |
          WEBHOOK_PATH="webhooks/aws/${{ matrix.webhook }}"
          if [[ -d "$WEBHOOK_PATH" ]] && [[ -n "$(ls -A $WEBHOOK_PATH)" ]]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Webhook directory exists and is not empty"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  Webhook directory does not exist or is empty, skipping deployment"
          fi

      - name: Install system dependencies
        if: steps.should-deploy.outputs.deploy == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip

      - name: Authenticate to CodeArtifact
        if: steps.should-deploy.outputs.deploy == 'true' && steps.check-exists.outputs.exists == 'true' && steps.check-s3-artifact.outputs.exists != 'true'
        id: auth-codeartifact
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain aetherion \
            --domain-owner ${{ env.NONPROD_ACCOUNT_ID }} \
            --region us-east-1 \
            --query authorizationToken \
            --output text)
          URL=$(aws codeartifact get-repository-endpoint \
            --domain aetherion \
            --repository aetherion \
            --format pypi \
            --region us-east-1 \
            --query repositoryEndpoint \
            --output text)
          echo "codeartifact_token=$TOKEN" >> $GITHUB_OUTPUT
          echo "repo_url=${URL#https://}" >> $GITHUB_OUTPUT

      - name: Install dependencies and package Lambda
        if: steps.should-deploy.outputs.deploy == 'true' && steps.check-exists.outputs.exists == 'true' && steps.check-s3-artifact.outputs.exists != 'true'
        id: package
        run: |
          WEBHOOK_PATH="webhooks/aws/${{ matrix.webhook }}"
          PACKAGE_DIR="lambda-package-${{ matrix.webhook }}"

          echo "📦 Packaging Lambda function for ${{ matrix.webhook }}"

          # Create package directory
          mkdir -p "$PACKAGE_DIR"

          # Copy Lambda function code
          cp -r "$WEBHOOK_PATH"/* "$PACKAGE_DIR/"
          
          # Set up CodeArtifact URL for pip
          CA_URL="https://aws:${{ steps.auth-codeartifact.outputs.codeartifact_token }}@${{ steps.auth-codeartifact.outputs.repo_url }}simple/"

          # Install dependencies - check for pyproject.toml first, then requirements.txt
          if [[ -f "$PACKAGE_DIR/pyproject.toml" ]]; then
            echo "📥 Found pyproject.toml, extracting dependencies..."
            
            # Extract dependencies from pyproject.toml using Python
            EXTRACT_SCRIPT=$(mktemp)
            printf '%s\n' \
              'import tomllib' \
              'import sys' \
              'import os' \
              '' \
              'package_dir = os.environ["PACKAGE_DIR"]' \
              'try:' \
              '    with open(f"{package_dir}/pyproject.toml", "rb") as f:' \
              '        data = tomllib.load(f)' \
              '    ' \
              '    dependencies = data.get("project", {}).get("dependencies", [])' \
              '    if dependencies:' \
              '        with open(f"{package_dir}/requirements.txt", "w") as req_file:' \
              '            req_file.write("\n".join(dependencies))' \
              '        print("✅ Extracted dependencies from pyproject.toml")' \
              '    else:' \
              '        print("ℹ️  No dependencies in pyproject.toml - Lambda has no external deps (OK)")' \
              '    sys.exit(0)' \
              'except Exception as e:' \
              '    print(f"❌ Error extracting dependencies: {e}")' \
              '    sys.exit(1)' > "$EXTRACT_SCRIPT"
            
            PACKAGE_DIR="$PACKAGE_DIR" python3 "$EXTRACT_SCRIPT"
            rm -f "$EXTRACT_SCRIPT"

            if [[ -f "$PACKAGE_DIR/requirements.txt" ]]; then
              echo "📥 Installing Python dependencies for AWS Lambda (Linux x86_64)..."
              # --only-binary=:all: required by pip when using --platform (cross-compile for Lambda)
              # Use 3.12.10+ here: pip treats "3.12" as 3.12.0; deps like ursa require Requires-Python >=3.12.10
              # --platform is a literal tag match (no manylinux compat-chain expansion), so pass both:
              # manylinux_2_28_x86_64 for newer wheels (PyMuPDF 1.26+) that dropped manylinux2014, and
              # manylinux2014_x86_64 for deps (e.g. cffi 2.0.0, pulled in by cryptography) that still only
              # publish manylinux2014/glibc 2.17 wheels. Both run fine on AL2023 Lambda's glibc.
              pip install \
                --extra-index-url "$CA_URL" \
                -r "$PACKAGE_DIR/requirements.txt" \
                -t "$PACKAGE_DIR/" \
                --platform manylinux_2_28_x86_64 \
                --platform manylinux2014_x86_64 \
                --implementation cp \
                --python-version 3.12.10 \
                --only-binary=:all: \
                --upgrade \
                --quiet
              echo "✅ Dependencies installed"
            fi
          elif [[ -f "$PACKAGE_DIR/requirements.txt" ]]; then
            echo "📥 Installing Python dependencies from requirements.txt for AWS Lambda (Linux x86_64)..."
            # --only-binary=:all: required by pip when using --platform (cross-compile for Lambda)
            # Use 3.12.10+: pip treats "3.12" as 3.12.0; packages with Requires-Python >=3.12.10 would be skipped
            # --platform is a literal tag match (no manylinux compat-chain expansion), so pass both:
            # manylinux_2_28_x86_64 for newer wheels (PyMuPDF 1.26+) that dropped manylinux2014, and
            # manylinux2014_x86_64 for deps (e.g. cffi 2.0.0, pulled in by cryptography) that still only
            # publish manylinux2014/glibc 2.17 wheels. Both run fine on AL2023 Lambda's glibc.
            pip install \
              --extra-index-url "$CA_URL" \
              -r "$PACKAGE_DIR/requirements.txt" \
              -t "$PACKAGE_DIR/" \
              --platform manylinux_2_28_x86_64 \
              --platform manylinux2014_x86_64 \
              --implementation cp \
              --python-version 3.12.10 \
              --only-binary=:all: \
              --upgrade \
              --quiet
            echo "✅ Dependencies installed"
          else
            echo "ℹ️  No requirements.txt or pyproject.toml found, skipping dependency installation"
          fi

          # Remove unnecessary files to reduce package size
          cd "$PACKAGE_DIR"
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "*.dist-info" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          find . -type f -name "*.pyo" -delete 2>/dev/null || true
          cd ..

          # Create deployment package
          echo "📦 Creating deployment package..."
          cd "$PACKAGE_DIR"
          zip -r "../${{ matrix.webhook }}-deployment.zip" . -q
          cd ..

          # Check package size
          PACKAGE_SIZE=$(du -h "${{ matrix.webhook }}-deployment.zip" | cut -f1)
          echo "📦 Package size: $PACKAGE_SIZE"

          # Output zip file path for use in next steps
          ZIP_NAME="${{ matrix.webhook }}-deployment.zip"
          echo "zip_file=${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Handle S3 artifact (copy, reuse, or upload) - non-prod account
        if: steps.should-deploy.outputs.deploy == 'true' && steps.check-exists.outputs.exists == 'true'
        id: upload-artifact
        env:
          AWS_REGION: us-east-1 # S3 operations always in non-prod account
        run: |
          WEBHOOK_NAME="${{ matrix.webhook }}"
          SHA_VERSION="${{ steps.get-commit-sha.outputs.sha_version }}"
          ENV="${{ needs.detect-changes.outputs.environment }}"

          echo "📦 Handling S3 artifact in non-prod account (${{ env.NONPROD_ACCOUNT_ID }})"

          if [[ "${{ needs.detect-changes.outputs.is_tag }}" == "true" ]]; then
            # Tag: copy sha-{sha} → v{version}, reuse or fallback to latest, never build
            VERSION="${{ needs.detect-changes.outputs.version }}"
            SOURCE_KEY="${{ steps.check-s3-artifact.outputs.source_s3_key }}"
            TARGET_KEY="lambdas/${WEBHOOK_NAME}/${VERSION}.zip"
            SOURCE_URI="s3://${{ env.ARTIFACT_BUCKET }}/${SOURCE_KEY}"
            TARGET_URI="s3://${{ env.ARTIFACT_BUCKET }}/${TARGET_KEY}"
            
            if [[ "${{ steps.check-s3-artifact.outputs.exists }}" == "true" ]]; then
              echo "📋 Copying S3 artifact in non-prod account (retag pattern - like ECR)"
              echo "   Source: $SOURCE_URI"
              echo "   Target: $TARGET_URI"
              echo "   Pattern: sha-{sha} → v{version} (same as ECR image retagging)"
              echo "   Note: Using artifact from last commit that changed this webhook folder"
              aws s3 cp "$SOURCE_URI" "$TARGET_URI" --metadata-directive COPY \
                --metadata "version=${VERSION},webhook=${WEBHOOK_NAME},type=release,source=${SHA_VERSION}"
              echo "✅ Retagged artifact: ${SHA_VERSION} → ${VERSION}"
              SOURCE_KEY="$SOURCE_KEY"  # Keep original source key
            else
              echo "❌ Error: Source artifact ${SHA_VERSION} not found in S3"
              echo "   Strict Release Policy: You MUST build the RC branch before creating a release Tag."
              echo "   Expected Artifact: s3://${{ env.ARTIFACT_BUCKET }}/${SOURCE_KEY}"
              echo "   Solution: Run this workflow on the RC branch/commit first to generate the artifact."
              exit 1
            fi
            
            S3_KEY="$TARGET_KEY"
            VERSION_OUTPUT="$VERSION"
            METADATA="version=${VERSION},webhook=${WEBHOOK_NAME},type=release"
          else
            # Main OR RC branch: reuse or build and upload
            # Unified logic: If artifact missing (e.g. Hotfix on RC), build it.
            SHA_KEY="lambdas/${WEBHOOK_NAME}/${SHA_VERSION}.zip"
            SHA_URI="s3://${{ env.ARTIFACT_BUCKET }}/${SHA_KEY}"
            if [[ "${{ steps.check-s3-artifact.outputs.exists }}" == "true" ]]; then
              echo "♻️  Reusing existing S3 artifact"
              echo "   Artifact: $SHA_URI"
              S3_KEY="$SHA_KEY"
              VERSION_OUTPUT="$SHA_VERSION"
              METADATA="commit=${{ steps.get-commit-sha.outputs.commit_sha }},env=${ENV},webhook=${WEBHOOK_NAME},reused=true"
            else
              echo "📦 Building new artifact (Main or RC)"
              ZIP_FILE="${{ steps.package.outputs.zip_file }}"
              echo "📤 Uploading to $SHA_URI"
              aws s3 cp "$ZIP_FILE" "$SHA_URI" --metadata "commit=${{ steps.get-commit-sha.outputs.commit_sha }},env=${ENV},webhook=${WEBHOOK_NAME}"
              S3_KEY="$SHA_KEY"
              VERSION_OUTPUT="$SHA_VERSION"
              METADATA="commit=${{ steps.get-commit-sha.outputs.commit_sha }},env=${ENV},webhook=${WEBHOOK_NAME}"
            fi
          fi

          echo "artifact_key=${S3_KEY}" >> $GITHUB_OUTPUT
          echo "version=${VERSION_OUTPUT}" >> $GITHUB_OUTPUT

          # For prod deployments, we need to download the artifact for Lambda deployment
          if [[ "$ENV" == "prod" ]]; then
            echo "📥 Prod deployment: Will download artifact for Lambda deployment"
            echo "download_needed=true" >> $GITHUB_OUTPUT
          else
            echo "download_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Get Lambda function name
        if: steps.should-deploy.outputs.deploy == 'true' && steps.check-exists.outputs.exists == 'true'
        id: lambda-name
        run: |
          # Convert webhook name to Lambda function name
          # Example: generic-webhook -> aetherion-dev-generic-webhook
          ENV_SUFFIX="${{ needs.detect-changes.outputs.environment }}"
          WEBHOOK_NAME="${{ matrix.webhook }}"
          LAMBDA_NAME="aetherion-${ENV_SUFFIX}-${WEBHOOK_NAME}"
          echo "name=$LAMBDA_NAME" >> $GITHUB_OUTPUT
          echo "📝 Lambda function name: $LAMBDA_NAME"

      - name: Download artifact for prod deployment (if needed)
        if: steps.should-deploy.outputs.deploy == 'true' && steps.check-exists.outputs.exists == 'true' && steps.upload-artifact.outputs.download_needed == 'true'
        env:
          AWS_REGION: us-east-1 # S3 is in non-prod account
        run: |
          S3_KEY="${{ steps.upload-artifact.outputs.artifact_key }}"
          S3_URI="s3://${{ env.ARTIFACT_BUCKET }}/${S3_KEY}"
          ZIP_FILE="${{ matrix.webhook }}-deployment.zip"

          echo "📥 Downloading artifact from non-prod S3 for prod deployment"
          echo "   Source: $S3_URI (non-prod account: ${{ env.NONPROD_ACCOUNT_ID }})"
          echo "   Target: $ZIP_FILE"

          aws s3 cp "$S3_URI" "$ZIP_FILE"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "❌ Error: Failed to download artifact from S3"
            exit 1
          fi

          echo "✅ Artifact downloaded successfully"
          echo "artifact_file=$ZIP_FILE" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials for Lambda deployment
        if: steps.should-deploy.outputs.deploy == 'true' && steps.check-exists.outputs.exists == 'true'
        id: aws-lambda-creds
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          aws-region: ${{ needs.detect-changes.outputs.aws-region }}
          role-to-assume: arn:aws:iam::${{ needs.detect-changes.outputs.account-id }}:role/github-action-deploy-role
        env:
          AWS_REGION: ${{ needs.detect-changes.outputs.aws-region }}

      - name: Deploy to Lambda
        if: steps.should-deploy.outputs.deploy == 'true' && steps.check-exists.outputs.exists == 'true'
        env:
          AWS_REGION: ${{ needs.detect-changes.outputs.aws-region }}
        run: |
          LAMBDA_NAME="${{ steps.lambda-name.outputs.name }}"
          ENV="${{ needs.detect-changes.outputs.environment }}"
          ACCOUNT_ID="${{ needs.detect-changes.outputs.account-id }}"

          echo "🚀 Deploying to Lambda function: $LAMBDA_NAME"
          echo "🌍 Environment: ${ENV}"
          echo "📦 Account: ${ACCOUNT_ID}"
          echo "🌐 Region: $AWS_REGION"


          # UNIFIED DEPLOYMENT STRATEGY (Cross-Region Safe)
          # Always download from S3 and deploy via local file reference.
          # This works regardless of whether Bucket and Lambda are in same/diff regions/accounts.

          if [[ "$ENV" == "prod" ]]; then
             # Prod: Artifact downloaded by previous step (Copy S3 -> Local)
             # NOTE: In prod flow, we downloaded it to a specific file.
             ZIP_FILE="${{ steps.upload-artifact.outputs.artifact_file }}"
          else
             # Non-Prod: Artifact is in S3. We MUST download it to local runner first
             # to avoid "InvalidParameterValueException: Bucket must be in same region" error.
             S3_KEY="${{ steps.upload-artifact.outputs.artifact_key }}"
             S3_URI="s3://${{ env.ARTIFACT_BUCKET }}/${S3_KEY}"
             ZIP_FILE="${{ matrix.webhook }}-deploy.zip"
             
             echo "📥 Downloading artifact from S3 for deployment..."
             aws s3 cp "$S3_URI" "$ZIP_FILE"
          fi

          if [[ -z "$ZIP_FILE" ]] || [[ ! -f "$ZIP_FILE" ]]; then
             # Fallback if variable is empty or file missing (should not happen)
             ZIP_FILE="${{ matrix.webhook }}-deployment.zip"
             if [[ ! -f "$ZIP_FILE" ]]; then
               echo "❌ Error: Deployment artifact not found at $ZIP_FILE"
               exit 1
             fi
          fi
            
          echo "📤 Deploying from local file..."
          echo "   File: $ZIP_FILE"
          echo "   Lambda: $LAMBDA_NAME (Account: $ACCOUNT_ID, Region: $AWS_REGION)"
            
          if aws lambda get-function --function-name "$LAMBDA_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
             echo "📝 Updating existing Lambda function..."
             aws lambda update-function-code \
               --function-name "$LAMBDA_NAME" \
               --zip-file "fileb://${ZIP_FILE}" \
               --region "$AWS_REGION"
              
             echo "✅ Lambda function update initiated"
          else
             echo "❌ Lambda function $LAMBDA_NAME does not exist"
             echo "⚠️  Please create the Lambda function first (Terraform)"
             exit 1
          fi

      - name: Wait for Lambda update to complete
        if: steps.should-deploy.outputs.deploy == 'true' && steps.check-exists.outputs.exists == 'true'
        env:
          AWS_REGION: ${{ needs.detect-changes.outputs.aws-region }}
        run: |
          LAMBDA_NAME="${{ steps.lambda-name.outputs.name }}"
          echo "⏳ Waiting for Lambda function to be ready..."

          MAX_ATTEMPTS=30
          ATTEMPT=0

          while [[ $ATTEMPT -lt $MAX_ATTEMPTS ]]; do
            STATE=$(aws lambda get-function --function-name "$LAMBDA_NAME" --region "$AWS_REGION" --query 'Configuration.State' --output text)
            LAST_UPDATE_STATUS=$(aws lambda get-function --function-name "$LAMBDA_NAME" --region "$AWS_REGION" --query 'Configuration.LastUpdateStatus' --output text)
            
            echo "  State: $STATE, Update Status: $LAST_UPDATE_STATUS"
            
            if [[ "$STATE" == "Active" && "$LAST_UPDATE_STATUS" == "Successful" ]]; then
              echo "✅ Lambda function is active and ready"
              break
            elif [[ "$LAST_UPDATE_STATUS" == "Failed" ]]; then
              echo "❌ Lambda update failed"
              exit 1
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
            sleep 5
          done

          if [[ $ATTEMPT -ge $MAX_ATTEMPTS ]]; then
            echo "⚠️  Timeout waiting for Lambda to be ready"
            exit 1
          fi

      - name: Update Lambda tags
        if: steps.should-deploy.outputs.deploy == 'true' && steps.check-exists.outputs.exists == 'true'
        env:
          AWS_REGION: ${{ needs.detect-changes.outputs.aws-region }}
        run: |
          LAMBDA_NAME="${{ steps.lambda-name.outputs.name }}"
          LAMBDA_ARN=$(aws lambda get-function --function-name "$LAMBDA_NAME" --region "$AWS_REGION" --query 'Configuration.FunctionArn' --output text)

          echo "🏷️  Updating Lambda tags..."
          aws lambda tag-resource \
            --resource "$LAMBDA_ARN" \
            --tags "{\"Environment\":\"${{ needs.detect-changes.outputs.environment }}\",\"GitCommit\":\"${{ github.sha }}\",\"GitBranch\":\"${{ github.ref_name }}\",\"DeployedBy\":\"github-actions\",\"DeployedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"Webhook\":\"${{ matrix.webhook }}\"}"

          echo "✅ Tags updated"

      - name: Deployment summary
        if: always() && steps.should-deploy.outputs.deploy == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_WEBHOOK: ${{ inputs.webhook }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          MATRIX_WEBHOOK: ${{ matrix.webhook }}
          LAMBDA_NAME: ${{ steps.lambda-name.outputs.name }}
          ENVIRONMENT: ${{ needs.detect-changes.outputs.environment }}
          AWS_REGION_OUTPUT: ${{ needs.detect-changes.outputs.aws-region }}
          ACCOUNT_ID: ${{ needs.detect-changes.outputs.account-id }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          ARTIFACT_VERSION: ${{ steps.upload-artifact.outputs.version }}
          S3_KEY: ${{ steps.upload-artifact.outputs.artifact_key }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** $EVENT_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**Input: Webhook:** $INPUT_WEBHOOK" >> $GITHUB_STEP_SUMMARY
          echo "**Input: Environment:** $INPUT_ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          echo "**Webhook:** $MATRIX_WEBHOOK" >> $GITHUB_STEP_SUMMARY
          echo "**Lambda Function:** $LAMBDA_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** $AWS_REGION_OUTPUT" >> $GITHUB_STEP_SUMMARY
          echo "**Account:** $ACCOUNT_ID" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** $COMMIT_SHA" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** $BRANCH_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact Version:** $ARTIFACT_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**S3 Key:** $S3_KEY" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "$JOB_STATUS" == "success" ]]; then
            echo "✅ **Status:** Deployment successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Deployment failed" >> $GITHUB_STEP_SUMMARY
          fi
