name: Trivy Security Scan

on:
  pull_request:
    branches:
      - main

  schedule: # run weekly on Monday at 1AM UTC
    - cron: "0 1 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write
  pull-requests: write

env:
  TRIVY_VERSION: v0.69.2
  AWS_REGION: us-east-1
  FAIL_SEVERITY: HIGH,CRITICAL
  PYTHON_VERSION: "3.12"

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      projects: ${{ steps.filter.outputs.projects }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Detect changed projects
        id: filter
        run: |
          set -euo pipefail

          # Get changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || echo "")
          else
            # For scheduled runs, check all projects
            CHANGED_FILES=$(find consumers webhooks -type f 2>/dev/null || echo "")
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Initialize projects array
          PROJECTS=()

          # Check consumers
          for dir in consumers/*/ consumers/aws/*/; do
            if [ -d "$dir" ]; then
              # Check if any file in this directory changed
              if echo "$CHANGED_FILES" | grep -q "^$dir" || [ "${{ github.event_name }}" == "schedule" ]; then
                PROJECT_NAME=$(echo "$dir" | sed 's|/$||' | tr '/' '-')
                PROJECT_PATH="$dir"
                PROJECT_TYPE="consumer"
                
                # Check for Dockerfile
                HAS_DOCKERFILE="false"
                if [ -f "$dir/Dockerfile" ]; then
                  HAS_DOCKERFILE="true"
                fi
                
                # Check for dependency files
                HAS_REQUIREMENTS="false"
                HAS_PYPROJECT="false"
                if [ -f "$dir/requirements.txt" ]; then
                  HAS_REQUIREMENTS="true"
                fi
                if [ -f "$dir/pyproject.toml" ]; then
                  HAS_PYPROJECT="true"
                fi
                
                # Only add if it has at least one dependency file
                if [ "$HAS_REQUIREMENTS" == "true" ] || [ "$HAS_PYPROJECT" == "true" ]; then
                  PROJECTS+=("{\"name\":\"$PROJECT_NAME\",\"path\":\"$PROJECT_PATH\",\"type\":\"$PROJECT_TYPE\",\"has_dockerfile\":\"$HAS_DOCKERFILE\",\"has_requirements\":\"$HAS_REQUIREMENTS\",\"has_pyproject\":\"$HAS_PYPROJECT\"}")
                fi
              fi
            fi
          done

          # Check webhooks
          for dir in webhooks/*/ webhooks/aws/*/; do
            if [ -d "$dir" ]; then
              # Check if any file in this directory changed
              if echo "$CHANGED_FILES" | grep -q "^$dir" || [ "${{ github.event_name }}" == "schedule" ]; then
                PROJECT_NAME=$(echo "$dir" | sed 's|/$||' | tr '/' '-')
                PROJECT_PATH="$dir"
                PROJECT_TYPE="webhook"
                
                # Check for Dockerfile
                HAS_DOCKERFILE="false"
                if [ -f "$dir/Dockerfile" ]; then
                  HAS_DOCKERFILE="true"
                fi
                
                # Check for dependency files
                HAS_REQUIREMENTS="false"
                HAS_PYPROJECT="false"
                if [ -f "$dir/requirements.txt" ]; then
                  HAS_REQUIREMENTS="true"
                fi
                if [ -f "$dir/pyproject.toml" ]; then
                  HAS_PYPROJECT="true"
                fi
                
                # Only add if it has at least one dependency file
                if [ "$HAS_REQUIREMENTS" == "true" ] || [ "$HAS_PYPROJECT" == "true" ]; then
                  PROJECTS+=("{\"name\":\"$PROJECT_NAME\",\"path\":\"$PROJECT_PATH\",\"type\":\"$PROJECT_TYPE\",\"has_dockerfile\":\"$HAS_DOCKERFILE\",\"has_requirements\":\"$HAS_REQUIREMENTS\",\"has_pyproject\":\"$HAS_PYPROJECT\"}")
                fi
              fi
            fi
          done

          # Output as JSON array
          if [ ${#PROJECTS[@]} -eq 0 ]; then
            echo "projects=[]" >> $GITHUB_OUTPUT
            echo "No projects to scan"
          else
            PROJECTS_JSON=$(IFS=,; echo "[${PROJECTS[*]}]")
            echo "projects=$PROJECTS_JSON" >> $GITHUB_OUTPUT
            echo "Projects to scan:"
            echo "$PROJECTS_JSON" | jq -r '.[] | "\(.name) - \(.path) (Dockerfile: \(.has_dockerfile), Requirements: \(.has_requirements), PyProject: \(.has_pyproject))"'
          fi

      - name: Generate Changed Projects markdown file
        run: |
          PROJECTS_JSON='${{ steps.filter.outputs.projects }}'
          OUTPUT_FILE="changed_projects.md"

          echo "## Trivy Scan - Changed Projects" > "$OUTPUT_FILE"
          echo "" >> "$OUTPUT_FILE"

          echo "| Name | Path | Type | Dockerfile | Requirements | PyProject |" >> "$OUTPUT_FILE"
          echo "|------|------|------|------------|--------------|-----------|" >> "$OUTPUT_FILE"

          echo "$PROJECTS_JSON" | jq -r '.[] | [.name, .path, .type, .has_dockerfile, .has_requirements, .has_pyproject] | @tsv' \
            | while IFS=$'\t' read -r name path type has_docker has_req has_py; do
                echo "| $name | $path | $type | $has_docker | $has_req | $has_py |" >> "$OUTPUT_FILE"
              done

      - name: Append markdown to GitHub Summary
        run: |
          cat changed_projects.md >> "$GITHUB_STEP_SUMMARY"

      - name: Cat MD file in logs (optional)
        run: |
          echo "### Changed Projects Markdown File:"
          cat changed_projects.md

  trivy-scan:
    needs: detect-changes
    if: needs.detect-changes.outputs.projects != '[]'
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.projects) }}
    env:
      PROJECT_NAME: ${{ matrix.project.name }}
      PROJECT_PATH: ${{ matrix.project.path }}
      PROJECT_TYPE: ${{ matrix.project.type }}
      HAS_DOCKERFILE: ${{ matrix.project.has_dockerfile }}
      HAS_REQUIREMENTS: ${{ matrix.project.has_requirements }}
      HAS_PYPROJECT: ${{ matrix.project.has_pyproject }}
      IMAGE_NAME: trivy-scan-${{ matrix.project.name }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up QEMU
        uses: docker/setup-qemu-action@4574d27a4764455b42196d70a065bc6853246a25

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@53ef279df5d7cd0583411f1448f8ded592f5edf2
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install uv
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-action-deploy-role

      - name: Authenticate to CodeArtifact and set outputs
        id: auth_codeartifact
        run: |
          TOKEN=$(aws codeartifact get-authorization-token --domain ${{ secrets.CODEARTIFACT_DOMAIN }} --domain-owner ${{ secrets.AWS_ACCOUNT_ID }} --region ${{ env.AWS_REGION }} --query authorizationToken --output text)
          URL=$(aws codeartifact get-repository-endpoint --domain ${{ secrets.CODEARTIFACT_DOMAIN }} --repository aetherion --format pypi --region ${{ env.AWS_REGION }} --query repositoryEndpoint --output text)
          echo "codeartifact_token=$TOKEN" >> $GITHUB_OUTPUT

      # Build Docker image if Dockerfile exists
      - name: Build Docker Image
        if: env.HAS_DOCKERFILE == 'true'
        env:
          DOCKER_BUILDKIT: 1
          CA_TOKEN: ${{ steps.auth_codeartifact.outputs.codeartifact_token }}
        run: |
          set -euo pipefail
          echo "Project path: ${{ env.PROJECT_PATH }}"
          echo "Token: ${{ steps.auth_codeartifact.outputs.codeartifact_token }}"
          echo "Image name: ${{ env.IMAGE_NAME }}"
          echo "Image tag: ${{ env.IMAGE_TAG }}"

          cd "${{ env.PROJECT_PATH }}"
          echo "Current directory: $(pwd)"
          echo "Dockerfile: $(ls -la Dockerfile)"

          docker buildx build \
          --platform linux/amd64 \
          --secret id=codeartifact_token,env=CA_TOKEN \
          -t "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
          --load .

      - name: Compute Trivy scanners
        id: compute_scanners
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ env.PROJECT_PATH }}"
          SCANNERS="secret,misconfiguration"

          if [ -d "$PROJECT_DIR" ]; then
            cd "$PROJECT_DIR"

            DOCKERFILE_EXISTS=false
            REQ_OR_PYPROJECT_EXISTS=false

            if [ -f Dockerfile ]; then
              DOCKERFILE_EXISTS=true
            fi

            if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
              REQ_OR_PYPROJECT_EXISTS=true
            fi

            # Logic:
            # If Dockerfile is missing AND req/pyproject exists → add vuln
            SHOULD_SCAN_VULN=false
            if [ "$DOCKERFILE_EXISTS" = false ] && [ "$REQ_OR_PYPROJECT_EXISTS" = true ]; then
              SHOULD_SCAN_VULN=true
              SCANNERS="${SCANNERS},vuln"
            fi

            echo "SHOULD_SCAN_VULN=$SHOULD_SCAN_VULN" >> $GITHUB_ENV
          fi

          echo "TRIVY_SCANNERS=$SCANNERS" >> $GITHUB_ENV
        shell: bash

      # Install dependencies for filesystem scan
      - name: Install Dependencies for FS Scan
        timeout-minutes: 20
        if: env.SHOULD_SCAN_VULN == 'true'
        env:
          UV_INDEX_CODEARTIFACT_USERNAME: aws
          UV_INDEX_CODEARTIFACT_PASSWORD: ${{ steps.auth_codeartifact.outputs.codeartifact_token }}

        run: |
          set -euo pipefail
          cd "${{ env.PROJECT_PATH }}"

          if [ "${{ env.HAS_PYPROJECT }}" == "true" ]; then
            echo "=== Installing dependencies with uv ==="
            
            if [ -z "$UV_INDEX_CODEARTIFACT_PASSWORD" ]; then
              echo "Error: CodeArtifact token is empty. Cannot configure uv."
              exit 1
            fi
            # Install dependencies using uv
            uv sync --no-install-project

          elif [ "${{ env.HAS_REQUIREMENTS }}" == "true" ]; then
            echo "=== Installing dependencies with pip ==="
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
            
          else
            echo "No dependency file found. Skipping dependency installation."
          fi

      # 1) IMAGE scan: vuln metadata from packages inside image
      - name: Trivy Image scan - vuln
        if: env.HAS_DOCKERFILE == 'true'
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: "image"
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          scanners: "vuln"
          ignore-unfixed: false
          severity: ${{ env.FAIL_SEVERITY }}
          format: "json"
          list-all-pkgs: true
          output: "trivy-image-${{ env.PROJECT_NAME }}.json"
          exit-code: "0"

      # 2) FILESYSTEM scan
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: "fs"
          scan-ref: "${{ env.PROJECT_PATH }}"
          scanners: ${{ env.TRIVY_SCANNERS }}
          format: "json"
          output: "trivy-fs-${{ env.PROJECT_NAME }}.json"
          severity: ${{ env.FAIL_SEVERITY }}
          ignore-unfixed: false
          exit-code: "0"

      - name: Generate Trivy Markdown report
        id: summary
        run: |
          set -euo pipefail

          IMAGE_JSON="trivy-image-${{ env.PROJECT_NAME }}.json"
          FS_JSON="trivy-fs-${{ env.PROJECT_NAME }}.json"
          OUT_FILE="trivy-results-${{ env.PROJECT_NAME }}.md"

          echo "Using:"
          echo "  Image JSON: $IMAGE_JSON"
          echo "  FS JSON:    $FS_JSON"
          echo "  Output MD:  $OUT_FILE"
          echo

          # helper: run jq safely (0 if file missing/empty)
          safe_jq() {
            local expr="$1"
            local file="$2"

            if [ -f "$file" ] && [ -s "$file" ]; then
              jq -r "$expr" "$file" 2>/dev/null || echo 0
            else
              echo 0
            fi
          }

          ########################################
          # COUNTS
          ########################################

          # --- Image: Vulnerabilities ---
          IMAGE_VULN_CRITICAL=$(safe_jq \
            '[.Results[]? | (.Vulnerabilities // [])[]? | select(.Severity=="CRITICAL")] | length' \
            "$IMAGE_JSON")

          IMAGE_VULN_HIGH=$(safe_jq \
            '[.Results[]? | (.Vulnerabilities // [])[]? | select(.Severity=="HIGH")] | length' \
            "$IMAGE_JSON")

          # --- Image: Misconfigurations (if you ever enable scanners=misconfig on image) ---
          IMAGE_MISCONF_CRITICAL=$(safe_jq \
            '[.Results[]? | (.Misconfigurations // [])[]? | select(.Severity=="CRITICAL" and .Status=="FAIL")] | length' \
            "$IMAGE_JSON")

          IMAGE_MISCONF_HIGH=$(safe_jq \
            '[.Results[]? | (.Misconfigurations // [])[]? | select(.Severity=="HIGH" and .Status=="FAIL")] | length' \
            "$IMAGE_JSON")

          # --- Image: Secrets (if scanners=secret added later) ---
          IMAGE_SECRET_CRITICAL=$(safe_jq \
            '[.Results[]? | (.Secrets // [])[]? | select(.Severity=="CRITICAL")] | length' \
            "$IMAGE_JSON")

          IMAGE_SECRET_HIGH=$(safe_jq \
            '[.Results[]? | (.Secrets // [])[]? | select(.Severity=="HIGH")] | length' \
            "$IMAGE_JSON")

          # --- FS: Vulnerabilities ---
          FS_VULN_CRITICAL=$(safe_jq \
            '[.Results[]? | (.Vulnerabilities // [])[]? | select(.Severity=="CRITICAL")] | length' \
            "$FS_JSON")

          FS_VULN_HIGH=$(safe_jq \
            '[.Results[]? | (.Vulnerabilities // [])[]? | select(.Severity=="HIGH")] | length' \
            "$FS_JSON")

          # --- FS: Misconfigurations ---
          FS_MISCONF_CRITICAL=$(safe_jq \
            '[.Results[]? | (.Misconfigurations // [])[]? | select(.Severity=="CRITICAL" and .Status=="FAIL")] | length' \
            "$FS_JSON")

          FS_MISCONF_HIGH=$(safe_jq \
            '[.Results[]? | (.Misconfigurations // [])[]? | select(.Severity=="HIGH" and .Status=="FAIL")] | length' \
            "$FS_JSON")

          # --- FS: Secrets ---
          FS_SECRET_CRITICAL=$(safe_jq \
            '[.Results[]? | (.Secrets // [])[]? | select(.Severity=="CRITICAL")] | length' \
            "$FS_JSON")

          FS_SECRET_HIGH=$(safe_jq \
            '[.Results[]? | (.Secrets // [])[]? | select(.Severity=="HIGH")] | length' \
            "$FS_JSON")

          # Totals per type
          TOTAL_VULN_CRITICAL=$((IMAGE_VULN_CRITICAL + FS_VULN_CRITICAL))
          TOTAL_VULN_HIGH=$((IMAGE_VULN_HIGH + FS_VULN_HIGH))

          TOTAL_MISCONF_CRITICAL=$((IMAGE_MISCONF_CRITICAL + FS_MISCONF_CRITICAL))
          TOTAL_MISCONF_HIGH=$((IMAGE_MISCONF_HIGH + FS_MISCONF_HIGH))

          TOTAL_SECRET_CRITICAL=$((IMAGE_SECRET_CRITICAL + FS_SECRET_CRITICAL))
          TOTAL_SECRET_HIGH=$((IMAGE_SECRET_HIGH + FS_SECRET_HIGH))

          TOTAL_CRITICAL=$((TOTAL_VULN_CRITICAL + TOTAL_MISCONF_CRITICAL + TOTAL_SECRET_CRITICAL))
          TOTAL_HIGH=$((TOTAL_VULN_HIGH + TOTAL_MISCONF_HIGH + TOTAL_SECRET_HIGH))

          ########################################
          # WRITE MARKDOWN
          ########################################

          {
            echo "## Trivy Security Scan Results – \`$PROJECT_NAME\`"
            echo
            echo "### Summary"
            echo
            echo "| Scan Type  | Finding Type   | CRITICAL | HIGH |"
            echo "|-----------|----------------|----------|------|"
            echo "| Image     | Vulnerability  | **$IMAGE_VULN_CRITICAL** | **$IMAGE_VULN_HIGH** |"
            echo "| Image     | Misconfig      | **$IMAGE_MISCONF_CRITICAL** | **$IMAGE_MISCONF_HIGH** |"
            echo "| Image     | Secret         | **$IMAGE_SECRET_CRITICAL** | **$IMAGE_SECRET_HIGH** |"
            echo "| Filesystem| Vulnerability  | **$FS_VULN_CRITICAL** | **$FS_VULN_HIGH** |"
            echo "| Filesystem| Misconfig      | **$FS_MISCONF_CRITICAL** | **$FS_MISCONF_HIGH** |"
            echo "| Filesystem| Secret         | **$FS_SECRET_CRITICAL** | **$FS_SECRET_HIGH** |"
            echo "| **TOTAL** | **ALL**        | **$TOTAL_CRITICAL** | **$TOTAL_HIGH** |"
            echo

            if [ "$TOTAL_CRITICAL" -eq 0 ] && [ "$TOTAL_HIGH" -eq 0 ]; then
              echo "**No HIGH or CRITICAL vulnerabilities, misconfigurations, or secrets detected.**"
              echo
            else
              echo "**HIGH or CRITICAL findings detected (vulns / misconfigs / secrets).**"
              echo

              ############################
              # Critical Vulnerabilities
              ############################
              echo "### Critical Vulnerabilities"
              echo
              if [ "$TOTAL_VULN_CRITICAL" -gt 0 ]; then
                echo "| Vulnerability ID | Package | Version | Title | Source |"
                echo "|------------------|---------|---------|-------|--------|"

                if [ -f "$IMAGE_JSON" ] && [ -s "$IMAGE_JSON" ]; then
                  jq -r '
                    .Results[]? |
                    (.Vulnerabilities // [])[]? |
                    select(.Severity=="CRITICAL") |
                    "| \(.VulnerabilityID) | \(.PkgName // "N/A") | \(.InstalledVersion // "N/A") | \(.Title // "N/A") | Image |"
                  ' "$IMAGE_JSON"
                fi

                if [ -f "$FS_JSON" ] && [ -s "$FS_JSON" ]; then
                  jq -r '
                    .Results[]? |
                    (.Vulnerabilities // [])[]? |
                    select(.Severity=="CRITICAL") |
                    "| \(.VulnerabilityID) | \(.PkgName // .Target // "N/A") | \(.InstalledVersion // "N/A") | \(.Title // "N/A") | Filesystem |"
                  ' "$FS_JSON"
                fi

                echo
              else
                echo "No critical vulnerabilities found."
                echo
              fi

              ############################
              # High Vulnerabilities
              ############################
              echo "### High Vulnerabilities"
              echo
              if [ "$TOTAL_VULN_HIGH" -gt 0 ]; then
                echo "| Vulnerability ID | Package | Version | Title | Source |"
                echo "|------------------|---------|---------|-------|--------|"

              if [ -f "$IMAGE_JSON" ] && [ -s "$IMAGE_JSON" ]; then
                jq -r '
                  .Results[]? |
                  (.Vulnerabilities // [])[]? |
                  select(.Severity=="HIGH") |
                  "| \(.VulnerabilityID) | \(.PkgName // "N/A") | \(.InstalledVersion // "N/A") | \(.Title // "N/A") | Image |"
                ' "$IMAGE_JSON"
              fi
              
              if [ -f "$FS_JSON" ] && [ -s "$FS_JSON" ]; then
                jq -r '
                  .Results[]? |
                  (.Vulnerabilities // [])[]? |
                  select(.Severity=="HIGH") |
                  "| \(.VulnerabilityID) | \(.PkgName // .Target // "N/A") | \(.InstalledVersion // "N/A") | \(.Title // "N/A") | Filesystem |"
                ' "$FS_JSON"
              fi

              echo
              else
                echo "No high vulnerabilities found."
                echo
              fi

              ############################
              # Critical Misconfigurations
              ############################
              echo "### Critical Misconfigurations"
              echo
              if [ "$TOTAL_MISCONF_CRITICAL" -gt 0 ]; then
                echo "| Rule ID | Location | Title | Source |"
                echo "|---------|----------|-------|--------|"

                if [ -f "$IMAGE_JSON" ] && [ -s "$IMAGE_JSON" ]; then
                  jq -r '
                    .Results[]? |
                    (.Misconfigurations // [])[]? |
                    select(.Severity=="CRITICAL" and .Status=="FAIL") |
                    "| \(.ID // .RuleID // "N/A") | \(.Target // "N/A") | \(.Title // "N/A") | Image |"
                  ' "$IMAGE_JSON"
                fi

                if [ -f "$FS_JSON" ] && [ -s "$FS_JSON" ]; then
                  jq -r '
                    .Results[]? |
                    (.Misconfigurations // [])[]? |
                    select(.Severity=="CRITICAL" and .Status=="FAIL") |
                    "| \(.ID // .RuleID // "N/A") | \(.Target // "N/A") | \(.Title // "N/A") | Filesystem |"
                  ' "$FS_JSON"
                fi

                echo
              else
                echo "No critical misconfigurations found."
                echo
              fi

              ############################
              # High Misconfigurations
              ############################
              echo "### High Misconfigurations"
              echo
              if [ "$TOTAL_MISCONF_HIGH" -gt 0 ]; then
                echo "| Rule ID | Title | Source | References |"
                echo "|---------|----------|-------|--------|"

              if [ -f "$IMAGE_JSON" ] && [ -s "$IMAGE_JSON" ]; then
                jq -r '
                  .Results[]? |
                  (.Misconfigurations // [])[]? |
                  select(.Severity=="HIGH" and .Status=="FAIL") |
                  "| \(.ID // ([.RuleID] + (.PrimaryURL)) // "N/A") | \(.Title // "N/A") | Image | \(.References | join(", ") // "N/A") |"
                ' "$IMAGE_JSON"
              fi

              if [ -f "$FS_JSON" ] && [ -s "$FS_JSON" ]; then
                jq -r '
                  .Results[]? |
                  (.Misconfigurations // [])[]? |
                  select(.Severity=="HIGH" and .Status=="FAIL") |
                  "| \(.ID // ([.RuleID] + (.PrimaryURL)) // "N/A") | \(.Title // "N/A") | Filesystem | \(.References | join(", ") // "N/A") |"
                ' "$FS_JSON"
              fi

              echo
              else
                echo "No high misconfigurations found."
                echo
              fi

              ############################
              # Critical Secrets
              ############################
              echo "### Critical Secrets"
              echo
              if [ "$TOTAL_SECRET_CRITICAL" -gt 0 ]; then
              echo "| Rule ID | File | Title | Source |"
              echo "|---------|------|-------|--------|"

              if [ -f "$IMAGE_JSON" ] && [ -s "$IMAGE_JSON" ]; then
                  jq -r '
                  .Results[]? as $r
                  | ($r.Secrets // [])[]?
                  | select(.Severity == "CRITICAL")
                  | "| \(.RuleID // "N/A") | \($r.Target // "N/A") | \(.Title // "N/A") | Image |"
                  ' "$IMAGE_JSON"
              fi

              if [ -f "$FS_JSON" ] && [ -s "$FS_JSON" ]; then
                  jq -r '
                  .Results[]? as $r
                  | ($r.Secrets // [])[]?
                  | select(.Severity == "CRITICAL")
                  | "| \(.RuleID // "N/A") | \($r.Target // "N/A") | \(.Title // "N/A") | Filesystem |"
                  ' "$FS_JSON"
              fi

                  echo
              else
                  echo "No critical secrets found."
                  echo
              fi

              ############################
              # High Secrets
              ############################
              echo "### High Secrets"
              echo
              if [ "$TOTAL_SECRET_HIGH" -gt 0 ]; then
              echo "| Rule ID | File | Title | Source |"
              echo "|---------|------|-------|--------|"

              if [ -f "$IMAGE_JSON" ] && [ -s "$IMAGE_JSON" ]; then
                  jq -r '
                  .Results[]? as $r
                  | ($r.Secrets // [])[]?
                  | select(.Severity == "HIGH")
                  | "| \(.RuleID // "N/A") | \($r.Target // "N/A") | \(.Title // "N/A") | Image |"
                  ' "$IMAGE_JSON"
              fi

              if [ -f "$FS_JSON" ] && [ -s "$FS_JSON" ]; then
                  jq -r '
                  .Results[]? as $r
                  | ($r.Secrets // [])[]?
                  | select(.Severity == "HIGH")
                  | "| \(.RuleID // "N/A") | \($r.Target // "N/A") | \(.Title // "N/A") | Filesystem |"
                  ' "$FS_JSON"
              fi

                  echo
              else
                  echo "No high secrets found."
                  echo
              fi



              echo "---"
              echo
              echo "> **HIGH/CRITICAL findings present. Please fix them before merging.**"
            fi

              echo 
            if [ "$TOTAL_CRITICAL" -gt 0 ] || [ "$TOTAL_HIGH" -gt 0 ]; then
              echo "**Summary:** $TOTAL_CRITICAL CRITICAL, $TOTAL_HIGH HIGH vulnerability/misconfiguration/secret detected."
              echo
            else
              echo "**Summary:** No HIGH or CRITICAL vulnerabilities, misconfigurations, or secrets detected."
            fi

          } > "$OUT_FILE"

          echo "Markdown summary written to: $OUT_FILE"
          # 
          echo "has_vulnerabilities=$([ "$TOTAL_CRITICAL" -gt 0 ] || [ "$TOTAL_HIGH" -gt 0 ] && echo "true" || echo "false")" >> $GITHUB_OUTPUT
          echo "critical_count=$TOTAL_CRITICAL" >> $GITHUB_OUTPUT
          echo "high_count=$TOTAL_HIGH" >> $GITHUB_OUTPUT

      - name: Convert Trivy JSON to SARIF and Table format
        run: |
          FILE="trivy-image-${{ env.PROJECT_NAME }}.json"
          if [ -f "$FILE" ]; then
            trivy convert --format sarif --output trivy-image-${{ env.PROJECT_NAME }}.sarif "$FILE" || echo "Failed to convert image JSON to SARIF"
            trivy convert --format table --output trivy-image-${{ env.PROJECT_NAME }}.txt "$FILE" || echo "Failed to convert image JSON to table"
            if [ ! -f "trivy-image-${{ env.PROJECT_NAME }}.txt" ]; then
              echo "Warning: Image TXT file was not created"
            fi
          else
            echo "No IMAGE results to convert"
          fi
          FILE="trivy-fs-${{ env.PROJECT_NAME }}.json"
          if [ -f "$FILE" ]; then
            trivy convert --format sarif --output trivy-fs-${{ env.PROJECT_NAME }}.sarif "$FILE" || echo "Failed to convert FS JSON to SARIF"
            trivy convert --format table --output trivy-fs-${{ env.PROJECT_NAME }}.txt "$FILE" || echo "Failed to convert FS JSON to table"
            if [ ! -f "trivy-fs-${{ env.PROJECT_NAME }}.txt" ]; then
              echo "Warning: FS TXT file was not created"
            fi
          else
            echo "No FS results to convert"
          fi

      - name: Add Trivy scan results to GitHub Summary
        if: always()
        run: |
          if [ -f "trivy-results-${{ env.PROJECT_NAME }}.md" ]; then
            cat "trivy-results-${{ env.PROJECT_NAME }}.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Trivy Security Scan Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Summary file not found. Check scan steps for errors." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post or Update Trivy summary as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const fs = require('fs');
            const service = '${{ env.PROJECT_NAME }}';
            const marker = `<!-- trivy-scan-summary:${service} -->`;
            const hasVulns = '${{ steps.summary.outputs.has_vulnerabilities }}' === 'true';
            const criticalCount = parseInt('${{ steps.summary.outputs.critical_count }}') || 0;
            const highCount = parseInt('${{ steps.summary.outputs.high_count }}') || 0;

            let summary = '';
            try {
              summary = fs.readFileSync('trivy-results-${{ env.PROJECT_NAME }}.md', 'utf8');
            } catch (error) {
              summary = 'Unable to read scan summary. Please check the workflow logs.';
            }

            // Get IST time
            const now = new Date();
            const options = { timeZone: 'Asia/Kolkata', hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            const istString = now.toLocaleString('en-IN', options);
            const runTime = `${istString} IST`;

            // Build the Security tab filtered link for this PR
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.issue.number;
            const securityLink = `https://github.com/${owner}/${repo}/security/code-scanning?query=is%3Aopen+pr%3A${prNumber}`;
            const workflowRunLink = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // Get all comments on the PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Find a bot comment with the marker for this service
            const botComment = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' && comment.body.includes(marker)
            );

            // Build status badge
            const statusBadge = hasVulns ? '**VULNERABILITIES DETECTED**' : '**NO VULNERABILITIES**';

            const statusPrefix = hasVulns ? '[FAILED]' : '[PASSED]';

            // Build the comment body
            const newBody = `${marker}

            ## ${statusPrefix} Trivy Security Scan Results

            **Status:** ${statusBadge}

            **Scan Time:** ${runTime}  
            **Service:** \`${service}\`  
            **Workflow Run:** [View Details](${workflowRunLink})

            ---

            ${summary}`;

            if (botComment) {
              // Update the existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: newBody,
              });
            } else {
              // Create a new comment for this service
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: newBody,
              });
            }

      - name: Block PR on HIGH and CRITICAL vulnerabilities
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          CRITICAL_COUNT=${{ steps.summary.outputs.critical_count }}
          HIGH_COUNT=${{ steps.summary.outputs.high_count }}

          echo "================================================"
          echo "Security Check: Blocking PR on Vulnerabilities"
          echo "================================================"
          echo "Total: $CRITICAL_COUNT CRITICAL, $HIGH_COUNT HIGH"
          echo "================================================"
          echo ""

          if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
            echo "BLOCKING: HIGH or CRITICAL vulnerabilities detected!"
            echo ""
            echo "Vulnerabilities found for this PR. Please fix them before merging."
            echo ""
            echo "This PR cannot be merged until all HIGH and CRITICAL vulnerabilities are resolved."
            exit 1
          else
            echo "No HIGH or CRITICAL vulnerabilities detected. PR is safe to merge."
          fi
