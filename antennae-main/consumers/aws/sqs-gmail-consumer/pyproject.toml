[project]
name = "sqs-gmail-consumer"
version = "0.0.1"
description = "SQS Consumer for gmail events"
authors = [{ name = "Calfus", email = "cloudops@calfus.com" }]
requires-python = ">=3.12.10,<3.14"
readme = "README.md"

dependencies = [
    "ursa==0.0.34",
    "google-api-python-client==2.160.0",
    "google-auth==2.47.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.3.0",
    "pytest-mock==3.15.1",
    "ruff==0.12.12",
    "black==25.12.0",
    "pre-commit==4.5.1",
]

[[tool.uv.index]]
name = "default"
url = "https://pypi.org/simple/"
default = true

[[tool.uv.index]]
name = "codeartifact"
url = "https://aetherion-285774563994.d.codeartifact.us-east-1.amazonaws.com/pypi/aetherion/simple/"
explicit = true

[tool.uv.sources]
ursa = { index = "codeartifact" }

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
