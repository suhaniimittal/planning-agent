[project]
name = "plan-agent"
version = "0.0.35"
description = "Aetherion SDK project for building AI agents and workflows"
authors = [{ name = "Calfus Inc.", email = "support@calfus.com" }]
readme = "README.md"
# Pinned to 3.12 (not just ">=3.12.10,<3.14") because aetherion-sdk below
# ships only a cp312 wheel — claiming 3.13 support here would be inaccurate,
# not just permissive.
requires-python = ">=3.12.10,<3.13"


dependencies = [
    "aetherion-sdk @ https://sdk.sbox.aetherion.io/Darwin/aetherion_sdk-0.0.112-cp312-cp312-macosx_26_0_arm64.whl",
    "httpx",
    # Memsy: the conversation about each TDD (src/memory/conversation.py, 2026-10-26).
    "memsy==0.3.5",
    # AES-256-GCM / HKDF / HMAC for the memory snapshots kept in Memsy
    # (src/ingestion/code_crypto.py, used by src/memory/record.py).
    "cryptography>=43",
    "pydantic>=2.13,<3",
    "pyyaml",
    # pyhanko (pulled in by xhtml2pdf, for a PDF-signing feature this project
    # never uses) constructs a zoneinfo.ZoneInfo('Europe/Brussels') at
    # IMPORT time — not when actually signing anything. Minimal Linux
    # containers often ship with no system timezone database at all, so
    # that import fails outright with ZoneInfoNotFoundError unless the
    # Python-side tzdata package (a pure-Python, platform-independent
    # bundle of the IANA database, with no platform wheel to miss) is
    # installed as a fallback.
    "tzdata",
    "xhtml2pdf",
    # The text of a PDF attached to a card (src/tdd/attachments.py, 2026-11-02).
    # Pure Python and BSD: no platform wheel to miss.
    "pypdf",
    # Pinned explicitly: arize-phoenix (a transitive dep of aetherion-sdk,
    # never imported by our own code) pulls in strawberry-graphql, which in
    # turn requires a graphql-core version it's actually compatible with.
    # Left unpinned, dependency resolution can land on a combination where
    # strawberry's `from graphql.execution import ExecutionContext` fails
    # at import time — this exact pair is confirmed to import cleanly.
    "graphql-core>=3.2,<3.3",
    "strawberry-graphql==0.287.3",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.3.0",
    "ruff==0.12.12",
    "black==25.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# aetherion-sdk's wheel is macOS-arm64-only (cp312-cp312-macosx_*_arm64), so
# uv's default cross-platform ("universal") resolution fails the moment it
# tries any other OS/arch combo in the requires-python range — even though
# nobody is actually running this project there. Restricting the resolved
# environment to the one platform that wheel supports fixes `uv lock`/`uv
# sync` without needing a wider, unsatisfiable requires-python range.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
