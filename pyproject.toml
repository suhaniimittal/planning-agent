[project]
name = "plan-agent"
version = "0.0.1"
description = "Aetherion SDK project for building AI agents and workflows"
authors = [{ name = "Calfus Inc.", email = "support@calfus.com" }]
readme = "README.md"
# Pinned to 3.12 (not just ">=3.12.10,<3.14") because aetherion-sdk below
# ships only a cp312 wheel — claiming 3.13 support here would be inaccurate,
# not just permissive.
requires-python = ">=3.12.10,<3.13"


dependencies = [
    "aetherion-sdk @ https://sdk.sbox.aetherion.io/Darwin/aetherion_sdk-0.0.93-cp312-cp312-macosx_26_0_arm64.whl",
    "neo4j",
    "pydantic>=2.13,<3",
    "tree-sitter",
    "tree-sitter-language-pack",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.3.0",
    "ruff==0.12.12",
    "black==25.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# aetherion-sdk's wheel is macOS-arm64-only (cp312-cp312-macosx_*_arm64), so
# uv's default cross-platform ("universal") resolution fails the moment it
# tries any other OS/arch combo in the requires-python range — even though
# nobody is actually running this project there. Restricting the resolved
# environment to the one platform that wheel supports fixes `uv lock`/`uv
# sync` without needing a wider, unsatisfiable requires-python range.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
